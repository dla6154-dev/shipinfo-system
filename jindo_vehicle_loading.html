<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>차량적재 확인 — 진도 운항관리센터</title>
<style>
  :root {
    --navy: #0B2545;
    --navy-mid: #1B3B6F;
    --blue: #1E6FBA;
    --blue-light: #3A8FD6;
    --accent: #E8A020;
    --accent-light: #F5C96A;
    --danger: #C0392B;
    --danger-bg: #FDECEA;
    --ok: #1A7A3C;
    --ok-bg: #EAF7EE;
    --bg: #F2F5FA;
    --card: #FFFFFF;
    --border: #D0D9E8;
    --text: #111827;
    --text-sub: #4B5563;
    --text-muted: #9CA3AF;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Noto Sans KR', BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── 헤더 ── */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: #fff;
    padding: 16px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(11,37,69,0.3);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .header-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    flex-wrap: wrap;
  }
  .breadcrumb-item { color: rgba(255,255,255,0.85); }
  .breadcrumb-item.active { color: var(--accent-light); font-weight: 600; }
  .breadcrumb-sep { color: rgba(255,255,255,0.35); }

  /* ── 본문 ── */
  .content { padding: 16px; max-width: 600px; margin: 0 auto; }

  /* ── 선박 선택 ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .ship-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .ship-card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
    overflow: hidden;
  }
  .ship-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    transition: background 0.18s;
  }
  .ship-card:hover { border-color: var(--blue-light); box-shadow: 0 4px 16px rgba(30,111,186,0.12); }
  .ship-card:hover::before { background: var(--blue-light); }
  .ship-card.active { border-color: var(--blue); background: #EEF5FF; }
  .ship-card.active::before { background: var(--blue); }

  .ship-name { font-size: 14px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .ship-meta { font-size: 11px; color: var(--text-sub); }
  .ship-badge {
    display: inline-block;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
    width: fit-content;
  }
  .ship-card.active .ship-badge {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }

  /* ── 제한사항 배너 ── */
  .limit-banner {
    background: var(--danger-bg);
    border: 1px solid #F5C6C2;
    border-left: 4px solid var(--danger);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .limit-banner-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .limit-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .limit-item { display: flex; flex-direction: column; gap: 1px; }
  .limit-key { font-size: 10px; color: var(--text-muted); }
  .limit-val { font-size: 13px; font-weight: 700; color: var(--danger); }

  /* ── 케이스 목록 ── */
  .case-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  .case-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .case-btn:hover { border-color: var(--blue-light); background: #F5F9FF; }
  .case-btn.active { border-color: var(--blue); background: #EEF5FF; }

  .case-btn-left { flex: 1; }
  .case-btn-name { font-size: 13px; font-weight: 600; color: var(--navy); }
  .case-btn-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .case-btn-weight {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    white-space: nowrap;
  }
  .case-btn-arrow { color: var(--text-muted); font-size: 16px; }
  .case-btn.active .case-btn-arrow { color: var(--blue); transform: rotate(90deg); }
  .case-num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    background: var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-sub);
    margin-right: 10px;
  }
  .case-btn.active .case-num { background: var(--blue); color: #fff; }

  /* ── 케이스 상세 ── */
  .case-detail {
    background: var(--card);
    border: 1.5px solid var(--blue);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: -4px;
    margin-bottom: 8px;
    animation: slideDown 0.2s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-section { margin-bottom: 14px; }
  .detail-section:last-child { margin-bottom: 0; }

  .detail-heading {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .vehicle-rows { display: flex; flex-direction: column; gap: 8px; }
  .vehicle-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
  }
  .vehicle-icon { font-size: 22px; flex-shrink: 0; line-height: 1; }
  .vehicle-info { flex: 1; }
  .vehicle-type { font-size: 13px; font-weight: 600; color: var(--text); }
  .vehicle-spec { font-size: 11px; color: var(--text-sub); margin-top: 2px; font-feature-settings: 'tnum'; }
  .vehicle-count {
    font-size: 20px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1;
    text-align: right;
  }
  .vehicle-count-unit { font-size: 10px; color: var(--text-muted); font-weight: 400; }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .stat-item {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 10px;
    text-align: center;
  }
  .stat-val { font-size: 16px; font-weight: 800; color: var(--navy); }
  .stat-key { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  .lashing-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .lashing-row:last-child { border-bottom: none; }
  .lashing-label { color: var(--text-sub); }
  .lashing-val { font-weight: 700; color: var(--text); }

  /* ── 빈 상태 ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
  .empty-text { font-size: 14px; }

  /* ── 하단 여백 ── */
  .bottom-pad { height: 32px; }

  /* ── 도면 이미지 ── */
  .diagram-wrap {
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #f0f0f0;
    position: relative;
  }
  .diagram-img {
    width: 100%;
    display: block;
    cursor: zoom-in;
  }
  .diagram-hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 5px 0 6px;
    background: var(--bg);
  }

  /* ── 이미지 모달 ── */
  .img-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .img-modal.open { display: flex; }
  .img-modal img {
    max-width: 100%;
    max-height: 100vh;
    border-radius: 4px;
    touch-action: pinch-zoom;
  }
  .modal-close {
    position: absolute;
    top: 12px; right: 16px;
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    line-height: 1;
    background: rgba(0,0,0,0.4);
    border-radius: 50%;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── 총중량 ── */
  .weight-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 8px 12px;
    background: var(--bg);
    border-radius: var(--radius-sm);
  }
  .weight-val { font-size: 24px; font-weight: 800; color: var(--navy); }
  .weight-unit { font-size: 13px; color: var(--text-muted); }

  /* 숨김 */
  .hidden { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <a href="./index.html" style="display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.12);color:#fff;font-size:18px;flex-shrink:0;text-decoration:none;">&#8592;</a>
    <div class="header-icon">⚓</div>
    <div>
      <div class="header-title">차량적재 확인</div>
      <div class="header-sub">진도 운항관리센터 · KOMSA</div>
    </div>
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <span class="breadcrumb-item active">선박 선택</span>
  </div>
</div>

<div class="content">

  <!-- 선박 선택 -->
  <div id="view-ship">
    <div class="section-label">관리 선박 — 7척</div>
    <div class="ship-grid" id="ship-grid"></div>
  </div>

  <!-- 케이스 목록 -->
  <div id="view-case" class="hidden">
    <div id="limit-banner-wrap"></div>
    <div class="section-label" id="case-section-label">적재 케이스</div>
    <div class="case-list" id="case-list"></div>
  </div>

  <div class="bottom-pad"></div>
</div>

<!-- 이미지 모달 -->
<div class="img-modal" id="imgModal" onclick="closeImgModal()">
  <div class="modal-close" onclick="closeImgModal()">✕</div>
  <img id="modalImg" src="" />
</div>

<script src="./vehicle_loading_data.js"></script>
<script>
// ══════════════════════════════════════════════
// 선박 데이터
const SHIPS = window.VEHICLE_LOADING_SHIPS || [];
const IMAGES = window.VEHICLE_LOADING_IMAGES || {};
// ══════════════════════════════════════════════
let currentShip = null;
let openCase = null;

// ══════════════════════════════════════════════
// 렌더링
// ══════════════════════════════════════════════
function renderShips() {
  const grid = document.getElementById('ship-grid');
  grid.innerHTML = SHIPS.map(s => `
    <div class="ship-card ${currentShip?.id === s.id ? 'active' : ''}"
         onclick="selectShip('${s.id}')">
      <div class="ship-name">${s.name}</div>
      <div class="ship-meta">${s.meta}</div>
      <div class="ship-badge">${s.cases_count}케이스</div>
    </div>
  `).join('');
}

function selectShip(id) {
  currentShip = SHIPS.find(s => s.id === id);
  openCase = null;
  renderShips();
  renderCaseView();
  updateBreadcrumb();
}

function renderCaseView() {
  const viewCase = document.getElementById('view-case');
  const viewShip = document.getElementById('view-ship');

  if (!currentShip) {
    viewCase.classList.add('hidden');
    return;
  }

  viewShip.style.display = '';
  viewCase.classList.remove('hidden');

  // 제한사항 배너
  const l = currentShip.limits;
  document.getElementById('limit-banner-wrap').innerHTML = `
    <div class="limit-banner">
      <div class="limit-banner-title">⚠️ 적재 주요 제한사항</div>
      <div class="limit-grid">
        <div class="limit-item">
          <span class="limit-key">최대 차량 총중량</span>
          <span class="limit-val">${l.maxWeight}</span>
        </div>
        <div class="limit-item">
          <span class="limit-key">최대 차축 하중</span>
          <span class="limit-val">${l.axleLoad}</span>
        </div>

      </div>
    </div>
  `;

  document.getElementById('case-section-label').textContent =
    `${currentShip.name} — 적재 케이스 (${currentShip.cases.length}건)`;

  // 케이스 목록
  const list = document.getElementById('case-list');
  list.innerHTML = currentShip.cases.map((c, i) => `
    <div>
      <div class="case-btn ${openCase === i ? 'active' : ''}"
           onclick="toggleCase(${i})">
        <div class="case-num">${i + 1}</div>
        <div class="case-btn-left">
          <div class="case-btn-name">${c.name}</div>
          <div class="case-btn-sub">${c.short}</div>
        </div>
        ${c.totalWeight ? `<div class="case-btn-weight">${c.totalWeight.toFixed(3)}T</div>` : ''}
        <div class="case-btn-arrow">›</div>
      </div>
      ${openCase === i ? renderCaseDetail(c, i) : ''}
    </div>
  `).join('');
}

function renderCaseDetail(c, caseIdx) {
  const shipId = currentShip.id;
  const imgData = IMAGES[shipId] ? IMAGES[shipId][caseIdx] : null;
  const imgHtml = imgData
    ? `<div class="detail-section">
        <div class="detail-heading">적재 도면</div>
        <div class="diagram-wrap">
          <img src="data:image/jpeg;base64,${imgData}" class="diagram-img" onclick="openImgModal(this.src)" />
          <div class="diagram-hint">🔍 탭하면 크게 보기</div>
        </div>
      </div>`
    : '';

  const weightHtml = c.totalWeight ? `
    <div class="detail-section">
      <div class="detail-heading">총 적재 중량</div>
      <div class="weight-row">
        <span class="weight-val">${c.totalWeight.toFixed(3)}</span>
        <span class="weight-unit">TON</span>
      </div>
    </div>` : '';

  return `
    <div class="case-detail">
      ${imgHtml}
      <div class="detail-section">
        <div class="detail-heading">적재 차량</div>
        <div class="vehicle-rows">
          ${c.vehicles.map(v => `
            <div class="vehicle-row">
              <div class="vehicle-icon">${v.icon}</div>
              <div class="vehicle-info">
                <div class="vehicle-type">${v.type}</div>
                <div class="vehicle-spec">${v.spec}</div>
              </div>
              <div class="vehicle-count">
                ${v.count}<br>
                <span class="vehicle-count-unit">대</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
      ${weightHtml}
      <div class="detail-section">
        <div class="detail-heading">고박 장치</div>
        ${c.lashing.map(l => `
          <div class="lashing-row">
            <span class="lashing-label">${l.label}</span>
            <span class="lashing-val">${l.val}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function toggleCase(i) {
  openCase = openCase === i ? null : i;
  renderCaseView();
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentShip) {
    bc.innerHTML = `<span class="breadcrumb-item active">선박 선택</span>`;
  } else {
    bc.innerHTML = `
      <span class="breadcrumb-item" style="cursor:pointer" onclick="clearShip()">선박 선택</span>
      <span class="breadcrumb-sep">›</span>
      <span class="breadcrumb-item active">${currentShip.name}</span>
    `;
  }
}

function clearShip() {
  currentShip = null;
  openCase = null;
  renderShips();
  renderCaseView();
  updateBreadcrumb();
}

// 초기 렌더
renderShips();
renderCaseView();
updateBreadcrumb();

function openImgModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('imgModal').classList.add('open');
}
function closeImgModal() {
  document.getElementById('imgModal').classList.remove('open');
}
</script>

</body>
</html>
